# FreeANDIY rebrand rules for this repository (applied by freeandiy/tools/rebrand, after the
# patches in freeandiy/patches/). Modified-by: FreeANDIY (Free Andy Agency), 2026.
#
# Double-brace placeholders (e.g. this.name) come from branding.toml and app.toml (`rebrand vars`
# lists them). Every rule has a minimum match count: when upstream renames or moves something, the
# rule fails loudly instead of silently leaving the old brand in place.
#
# Protected text: rules first swap text that must keep the upstream name (cargo package names,
# file names we keep, upstream's copyright) for @@...@@ markers, and the last rules swap them
# back. The product name is replaced as a whole word in code: type names like `FilmCraftApp` stay.

templates = [
  "crates/ui-egui/src/freeandiy.rs",
  "crates/ui-egui/src/i18n/sk.tsv",
]

delete = [
  "docs/brand",                                  # ArtCraft marks: forks must remove them
  "assets/app-icon",                             # upstream's identity; ours is copied in below
  "packaging/icons.sh",                          # icons come from the FreeANDIY meta repository
  "packaging/macos/dmg",                         # background and layout derived from upstream's icon; ours is copied in
  ".github/workflows/release.yml",               # upstream's release and platform jobs; ours: freeandiy*.yml
  ".github/workflows/windows-arm64.yml",
  ".github/workflows/packaging-lint.yml",
  ".github/workflows/freebsd.yml",
]

# Translation catalogs: drop the Discord entries (the strings are gone from the UI); other
# ArtCraft mentions become FreeANDIY below, so complete catalogs stay complete.
[[drop_lines]]
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '^[^#\n]*Discord'
min = 0

# ---------------------------------------------------------------------------------------------
# Identifiers, maintainers, URLs.

[[replace]]
name = "app id"
include = ["**"]
exclude = ["**/*.md", "docs/**", "NOTICE", "ATTRIBUTION.md"]
find = "ai.storyteller.filmcraft"
replace = "{{this.app_id}}"
min = 10

[[replace]]
name = "developer id"
include = ["packaging/**"]
find = "ai.storyteller"
replace = "{{brand.id_prefix}}"
min = 0

[[replace]]
name = "package maintainer"
include = ["packaging/**"]
find = "FilmCraft maintainers <filmcraft@storyteller.ai>"
replace = "{{brand.maintainer}}"
min = 0

[[replace]]
name = "links in code: this app's page"
include = ["**/*.rs"]
find = "https://getartcraft.com/apps/filmcraft"
replace = "{{this.page}}"
min = 0

[[replace]]
name = "links in code: repository, releases, issues"
include = ["**/*.rs"]
exclude = ["vendor/**"]
find = "https://github.com/storytold/filmcraft"
replace = "{{this.github}}"
skip_comments = ["//"]
min = 0

[[replace]]
name = "link labels: this app's page (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
find = "getartcraft.com/apps/filmcraft"
replace = "freeandiy.freeandy.agency/{{this.key}}"
skip_comments = ["//"]
min = 0

[[replace]]
name = "link labels: source repository (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
find = "github.com/storytold/filmcraft"
replace = "github.com/{{brand.github_owner}}/{{this.repo}}"
skip_comments = ["//"]
min = 0

[[replace]]
name = "links in code: website"
include = ["**/*.rs"]
find = "https://getartcraft.com"
replace = "{{brand.website}}"
skip_comments = ["//"]
min = 0

[[replace]]
name = "labels: the website's host (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
exclude = ["xtask/**"]
find = "getartcraft.com"
replace = "freeandiy.freeandy.agency"
skip_comments = ["//"]
min = 0

[[replace]]
name = "website label (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
regex = 'ArtCraft [Ww]ebsite'
replace = "{{brand.name}} website"
min = 0

[[replace]]
name = "Crafting Apps"
include = ["crates/**/*.rs", "apps/**/*.rs", "packaging/**", "crates/ui-egui/src/i18n/*.tsv"]
find = "Crafting Apps"
replace = "{{brand.name}} apps"
min = 0

[[replace]]
name = "upstream issues URL"
include = ["packaging/**", ".github/**"]
find = "https://github.com/storytold/filmcraft/issues"
replace = "{{this.issues}}"
min = 0

[[replace]]
name = "upstream repository URL"
include = ["packaging/**", ".github/**"]
regex = 'https://github\.com/storytold/filmcraft(/|"|<|\x27|$)'
replace = "{{this.github}}${1}"
min = 0

[[replace]]
name = "upstream repo slug (raw URLs, GITHUB_REPOSITORY defaults)"
include = ["packaging/**", ".github/**"]
regex = 'storytold/filmcraft\b'
replace = "{{brand.github_owner}}/{{this.repo}}"
min = 0

[[replace]]
name = "upstream product page"
include = ["packaging/**", ".github/**", "apps/filmcraft-web/index.html"]
find = "https://getartcraft.com/apps/filmcraft"
replace = "{{this.page}}"
min = 0

[[replace]]
name = "upstream Discord (packaging contact/help links)"
include = ["packaging/**"]
find = "https://discord.gg/artcraft"
replace = "{{this.issues}}"
min = 0

# ---------------------------------------------------------------------------------------------
# Protect text that keeps the upstream name.

[[replace]]
name = "protect: upstream's copyright holder and contributors"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv", "packaging/**"]
regex = 'ArtCraft Team and the FilmCraft (contributors|authors)'
replace = 'ArtCraft Team and the @@UPSTREAM@@ ${1}'
min = 0

[[replace]]
name = "protect: upstream's copyright lines in the catalogs (ArtCraft, twice per line)"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '(?m)^([^\n]*Copyright[^\n]*?)ArtCraft'
replace = '${1}@@AC@@'
min = 0

[[replace]]
name = "protect: upstream's copyright lines in the catalogs (ArtCraft, 2nd)"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '(?m)^([^\n]*Copyright[^\n]*?)ArtCraft'
replace = '${1}@@AC@@'
min = 0

[[replace]]
name = "catalogs: other ArtCraft mentions"
include = ["crates/ui-egui/src/i18n/*.tsv"]
find = "ArtCraft"
replace = "{{brand.name}}"
min = 0

[[replace]]
name = "protect: attribution 'the FilmCraft authors'"
include = ["apps/*/build.rs", "packaging/**"]
find = "the FilmCraft authors"
replace = "{{brand.owner}} and the @@UPSTREAM@@ authors"
min = 0

[[replace]]
name = "web release zip: freeandiy-film-<version>-web-wasm32.zip (before the crate-name protect)"
include = ["packaging/web/package.sh", "packaging/web/README.md", "docs/releasing.md"]
regex = 'filmcraft-web-(<version>|<v>|\$VERSION)'
replace = "{{this.repo}}-${1}-web-wasm32"
min = 0

[[replace]]
name = "protect: cargo -p / --package filmcraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(-p|--package) filmcraft'
replace = '$1 @@PKG@@'
min = 1

[[replace]]
name = "protect: crate names filmcraft-<crate>"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'filmcraft-(aac|ac3|apv|audio\-dsp|automation|av1|avi|bitstream|captions|cfb|codecs|color|dng|dnx|edit|engine|export|flac|format|frame|geom|golden|gpu|h264|h264enc|hevc|interchange|isobmff|matroska|media|mpa|mpeg2v|mpegts|mxf|ogg|opus|platform|project|prores|render|scopes|speech|testkit|text|time|tts|tts\-text|ui\-egui|vp8|vp9|web)\b'
replace = '@@PKG@@-$1'
min = 0

[[replace]]
name = "protect: cargo features filmcraft/<feature>"
include = ["packaging/**", ".github/**"]
find = "'filmcraft/"
replace = "'@@PKG@@/"
min = 0

[[replace]]
name = "protect: source paths apps/filmcraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(apps[/\\])filmcraft'
replace = '${1}@@PKG@@'
min = 0

[[replace]]
name = "protect: crate idents filmcraft_"
include = ["packaging/**", ".github/**", "Dockerfile"]
find = "filmcraft_"
replace = "@@PKG@@_"
min = 0

[[replace]]
name = "protect: WiX sources filmcraft.wxs/.wxl"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'filmcraft(\.wxs|\.en-us\.wxl)'
replace = '@@PKG@@${1}'
min = 0

# ---------------------------------------------------------------------------------------------
# App-specific rules.

[[replace]]
name = "the suite's name in code (About, Help)"
include = ["crates/**/*.rs", "apps/**/*.rs"]
exclude = ["**/tests/**"]
find = "ArtCraft"
replace = "{{brand.name}}"
skip_comments = ["//"]
min = 1

# ---------------------------------------------------------------------------------------------
# The product name in the UI, messages, translations, packaging and the web page.

[[replace]]
name = "Info.plist custom keys: FilmCraftVersion, FilmCraftBuildCommit"
include = ["packaging/**"]
regex = 'FilmCraft(Version|BuildCommit)'
replace = 'FreeANDIYFilm${1}'
min = 0

[[replace]]
name = "product name after an escaped newline in strings (\\nFilmCraft)"
include = ["**/*.rs"]
exclude = ["xtask/**"]
find = '\nFilmCraft'
replace = '\n{{this.name}}'
skip_comments = ["//"]
min = 0

[[replace]]
name = "product name FilmCraft (Rust code, not comments; whole word)"
include = ["**/*.rs"]
exclude = ["xtask/**", "vendor/**"]
regex = '\bFilmCraft\b'
replace = "{{this.name}}"
skip_comments = ["//"]
min = 20

[[replace]]
name = "product name FilmCraft (catalogs: any script or inflection may follow it)"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = 'FilmCraft[a-z]*'
replace = "{{this.name}}"
min = 0

[[replace]]
name = "product name FilmCraft (packaging, web page, CI)"
include = ["packaging/**", "apps/filmcraft-web/index.html", ".github/**", "Dockerfile"]
exclude = ["**/*.md"]
regex = '\bFilmCraft\b'
replace = "{{this.name}}"
min = 10

# ---------------------------------------------------------------------------------------------
# Executables, packaging file names.

[[replace]]
name = "test binaries CARGO_BIN_EXE_filmcraft"
include = ["apps/**/*.rs"]
find = "CARGO_BIN_EXE_filmcraft"
replace = "CARGO_BIN_EXE_{{this.repo}}"
min = 0

[[replace]]
name = "cli executable name in code and catalogs"
include = ["apps/**/*.rs", "crates/**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
regex = '\bfilmcraft-cli\b'
replace = "{{this.repo}}-cli"
min = 0

[[replace]]
name = "icon file paths in code (assets/app-icon/filmcraft*)"
include = ["apps/**/*.rs", "crates/**/*.rs", "apps/*/build.rs", "xtask/**"]
find = "app-icon/filmcraft"
replace = "app-icon/{{this.repo}}"
min = 1

[[replace]]
name = "macOS window icon: our 1024 px tile"
include = ["apps/filmcraft/src/main.rs"]
find = "app-icon/{{this.repo}}-macos-512.png"
replace = "app-icon/{{this.repo}}-1024.png"
min = 1

[[replace]]
name = "windows exe resources"
include = ["apps/*/build.rs"]
regex = '"filmcraft(\.exe)?"'
replace = '"{{this.repo}}${1}"'
min = 0

[[replace]]
name = "packaging/CI: executables, file names, paths"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'filmcraft'
replace = "{{this.repo}}"
min = 20

[[replace]]
name = "MSI UpgradeCode (new GUID)"
include = ["packaging/windows/*.wxs"]
regex = 'UpgradeCode="[0-9A-Fa-f-]{36}"'
replace = 'UpgradeCode="{{this.msi_upgrade_code}}"'
min = 1

[[replace]]
name = "MSI component GUID 1 (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "15933017-925B-4963-8992-52000EB26AAA"
replace = "{{this.msi_component_guid}}"
min = 1

# ---------------------------------------------------------------------------------------------
# Restore protected text.

[[replace]]
name = "restore @@UPSTREAM@@"
include = ["**"]
find = "@@UPSTREAM@@"
replace = "{{this.upstream_name}}"
min = 0

[[replace]]
name = "restore @@AC@@ (upstream's copyright holder)"
include = ["**"]
find = "@@AC@@"
replace = "ArtCraft"
min = 0

[[replace]]
name = "restore @@PKG@@"
include = ["**"]
find = "@@PKG@@"
replace = "filmcraft"
min = 1

