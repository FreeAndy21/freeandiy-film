# ---------------------------------------------------------------------------------------------
# Shared by every FreeANDIY app (FreeAndy21/freeandiy, common/rules-windows-notices.toml):
# the Windows portable ZIP carries NOTICE, the attribution, the font licences and the brand terms
# like the other packages (Apache-2.0 4(d)).

[[replace]]
name = "Windows portable ZIP: notices, attribution, font licences, brand terms"
include = ["packaging/windows/package.ps1"]
regex = '''(?m)^foreach \(\$f in 'README\.md', 'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE'(?:, 'NOTICE')?\) \{\n  \$p = Join-Path \$Root \$f\n  if \(Test-Path \$p\) \{ Copy-Item \$p \$Portable \}\n\}'''
replace = '''foreach ($$f in 'README.md', 'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md', 'ASSETS.md', 'CHANGELOG-FREEANDIY.md') {
  $$p = Join-Path $$Root $$f
  if (Test-Path $$p) { Copy-Item $$p $$Portable }
}
# FreeANDIY: the bundled UI fonts' licences and the brand terms (Apache-2.0 4(d): NOTICE above).
Copy-Item (Join-Path $$Root 'freeandiy\assets\fonts\OFL-*.txt') $$Portable
Copy-Item (Join-Path $$Root 'freeandiy\assets\brand\LICENSE-brand.txt') (Join-Path $$Portable 'LICENSE-FreeANDIY-brand.txt')'''
min = 0

# ---------------------------------------------------------------------------------------------
# Shared by every FreeANDIY app (FreeAndy21/freeandiy, common/rules-vendor.toml): FreeANDIY builds
# are published by Free Andy Agency, not by upstream's company. The MSI manufacturer, the Windows
# executables' CompanyName, the Linux package vendor and the AppStream developer name say so.

[[replace]]
name = "vendor: Free Andy Agency publishes FreeANDIY builds (MSI, exe resources, Linux metadata)"
include = ["packaging/**", "apps/*/build.rs"]
find = "Learning Machines LLC"
replace = "{{brand.owner}}"
min = 1

[[replace]]
name = "links test: the extra link it opens is the issue tracker (FreeANDIY has no Discord link)"
include = ["crates/ui-egui/src/links.rs"]
regex = '\bDISCORD\b'
replace = "ISSUES"
min = 2

[[replace]]
name = "DPX creator field: the longer name needs a longer slice (the field is 100 bytes)"
include = ["crates/export/src/raster.rs"]
find = 'hd[160..169].copy_from_slice(b"FreeANDIY Film");'
replace = 'hd[160..174].copy_from_slice(b"FreeANDIY Film");'
min = 1

[[replace]]
name = "settings: the default highlight is FreeANDIY's stamp rose (the themes' own accent)"
include = ["crates/engine/src/settings.rs"]
find = 'pub const DEFAULT_HIGHLIGHT: &str = "#2f6bdf";'
replace = 'pub const DEFAULT_HIGHLIGHT: &str = "{{colors.rose}}";'
min = 1

[[replace]]
name = "font test: the first UI face is IBM Plex Sans (crate::freeandiy::ui_fonts), upstream's Inter right behind"
include = ["crates/ui-egui/src/theme.rs"]
find = 'defs.families[&FontFamily::Proportional].first().map(String::as_str), Some("inter"));'
replace = 'defs.families[&FontFamily::Proportional].first().map(String::as_str), Some("plex"));'
min = 1

# ---------------------------------------------------------------------------------------------
# Shared by every FreeANDIY app (FreeAndy21/freeandiy, common/rules-msi-notices.toml):
# the Windows MSI installs the licences, NOTICE, the attribution, the font licences and the brand
# terms next to the app, like the portable ZIP and the other packages (Apache-2.0 4(d)).

[[replace]]
name = "Windows MSI: stage the notices before wix build"
include = ["packaging/windows/package.ps1"]
regex = '''(?m)^(\$Msi = Join-Path \$Dist )'''
replace = '''# FreeANDIY: the MSI installs these next to the app (Apache-2.0 4(d); same set as the portable ZIP).
$$FaNotices = Join-Path $$Stage 'freeandiy-notices'
Remove-Item -Recurse -Force $$FaNotices -ErrorAction SilentlyContinue
New-Item -ItemType Directory -Force -Path $$FaNotices | Out-Null
foreach ($$f in 'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md', 'ASSETS.md') {
  $$p = Join-Path $$Root $$f
  if (Test-Path $$p) { Copy-Item $$p $$FaNotices }
}
Copy-Item (Join-Path $$Root 'freeandiy\assets\fonts\OFL-*.txt') $$FaNotices
Copy-Item (Join-Path $$Root 'freeandiy\assets\brand\LICENSE-brand.txt') (Join-Path $$FaNotices 'LICENSE-FreeANDIY-brand.txt')
if ($$env:CRAFT_FONTS_DIR) {
  Get-ChildItem -Path (Join-Path $$env:CRAFT_FONTS_DIR 'fonts') -Directory -ErrorAction SilentlyContinue | ForEach-Object {
    $$lic = Join-Path $$_.FullName 'OFL.txt'
    if (Test-Path $$lic) { Copy-Item $$lic (Join-Path $$FaNotices "OFL-$$($$_.Name).txt") }
  }
}
foreach ($$f in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE') {
  if (-not (Test-Path (Join-Path $$FaNotices $$f))) { throw "MSI notices: $$f is missing" }
}
# Leave out what upstream's .wxs already installs itself (two components for one file fail the build).
$$FaWxs = (Get-ChildItem (Join-Path $$PSScriptRoot '*.wxs') | ForEach-Object { Get-Content -Raw $$_.FullName }) -join "`n"
Get-ChildItem $$FaNotices | Where-Object { $$FaWxs -match [regex]::Escape('\' + $$_.Name + '"') } | Remove-Item

${1}'''

[[replace]]
name = "Windows MSI: pass the notices folder to wix build"
include = ["packaging/windows/package.ps1"]
regex = '''(wix build [^\n]*?-arch \$Arch)'''
replace = '''${1} -d "NoticesDir=$$FaNotices"'''

[[replace]]
name = "Windows MSI: install the notices (feature)"
include = ["packaging/windows/*.wxs"]
regex = '''(?m)^(\s*)(<ComponentGroupRef Id="[A-Za-z]+Files" />)'''
replace = '''${1}${2}
${1}<ComponentGroupRef Id="FreeandiyNotices" />'''

[[replace]]
name = "Windows MSI: install the notices (files)"
include = ["packaging/windows/*.wxs"]
exclude = ["packaging/windows/installer-ui.wxs"]
regex = '''(?m)^</Wix>'''
replace = '''  <!-- FreeANDIY: licences, NOTICE, attribution, font licences and brand terms (Apache-2.0 4(d)),
       staged by package.ps1. -->
  <Fragment>
    <ComponentGroup Id="FreeandiyNotices" Directory="INSTALLFOLDER">
      <Files Include="$$(var.NoticesDir)\*" />
    </ComponentGroup>
  </Fragment>
</Wix>'''
